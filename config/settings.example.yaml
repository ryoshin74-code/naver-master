# 네이버 마스터 설정 템플릿
# 이 파일을 config/settings.yaml 로 복사해 실제 값을 채운다.
# settings.yaml 은 개인 정보(채널 ID·말투 샘플)를 담으므로 gitignore 처리되어 있다.
# 키·토큰류는 전부 .env 로 분리 (커밋 금지).

youtube:
  channel_id: "UCxxxxxxxxxxxxxxxxxxxxxx"   # 사용자 유튜브 채널 ID
  post_delay_hours: 24                      # 송출 후 D+1 게시
  purchase_link_source: "description"      # 구매링크 출처: description(영상 설명란) | manual(별도 입력)

naver:
  blog_id: ""                               # blog.naver.com/{blog_id}
  cafe:
    club_url: ""                            # 게시할 카페 URL (본인 운영 카페)
    menu_name: ""                           # 게시판 이름
  daily_limits:
    blog_posts: 2
    cafe_posts: 2
    replies_total: 30
  posting_windows: ["10:30", "15:30"]       # 기본 게시 시각 (지터 ±25분)
  active_hours: ["09:00", "22:00"]

llm:
  provider: "openai"
  model: "gpt-5.1"                          # 분석·생성용 (비전 지원 모델이어야 함, 최신 모델로 조정 가능)
  review_model: "gpt-5.1"                   # 검수용 (생성과 분리된 컨텍스트로 호출)

report:
  kakao_send_time: "10:00"                  # 아침 보고 시각 (KST), 주말 포함 매일

comments:
  auto_reply: "reaction_only"               # 호응성 댓글만 자동 답글. 문의성·민감성은 HOLD 후 아침 보고

tone_guide: |
  # 사용자 말투 샘플 — 제목·본문·답글 생성과 검수(브랜드 톤 축)에 사용
  # 예: 친근한 반말 금지, '~해요'체, 과장 없는 실사용 후기 톤 등
  (여기에 사용자가 직접 쓴 글 샘플 2~3개를 붙여넣기)

disclosure_text: "본 포스팅은 직접 기획한 공동구매 상품을 소개하는 광고성 게시물입니다."

forbidden_words:
  - "최저가 보장"
  - "100% 효과"
