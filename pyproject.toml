[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "naver-master"
version = "0.1.0"
description = "전자동 네이버 카페·블로그 운영 관리 및 결과보고 시스템"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
